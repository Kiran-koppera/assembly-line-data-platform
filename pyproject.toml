[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assembly-line-data-platform"
version = "1.0.0"
description = "Data reliability platform for a simulated general-assembly line: PostgreSQL, dbt, monitoring, fault drills"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "simpy>=4.1", "numpy>=1.24", "pandas>=2.0", "psycopg[binary]>=3.1",
  "dbt-core>=1.9", "dbt-postgres>=1.9", "fastapi>=0.110", "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "httpx>=0.27"]
local = ["pgserver>=0.1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 125
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731", "UP007", "UP045", "UP006", "UP035"]
