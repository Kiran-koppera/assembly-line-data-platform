name: assembly_line
version: "1.0.0"
config-version: 2
profile: assembly_line

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  assembly_line:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  assembly_line:
    +schema: reference
    dim_station:
      +column_types:
        station_id: text
        sequence: int
        base_cycle_s: numeric
        joints: int
        is_quality_gate: boolean
        takt_s: numeric
